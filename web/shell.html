<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPTC Legacy</title>
  <style>
    :root { --bisque: #1a529f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0b1220; color: #e8eefc;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    header { padding: 18px 0 6px; text-align: center; }
    header h1 { margin: 0; font-size: 20px; letter-spacing: .12em; }
    header p { margin: 4px 0 0; color: #7f93b8; font-size: 12px; }
    #stage {
      width: min(96vw, 1280px); aspect-ratio: 16 / 9;
      background: var(--bisque); border: 1px solid #24344f;
      border-radius: 10px; overflow: hidden; margin: 12px 0;
    }
    canvas { width: 100%; height: 100%; display: block; }
    footer { color: #566b88; font-size: 11px; padding: 10px 0 24px; text-align: center; }
    footer a { color: #6ea8ff; }
  </style>
</head>
<body>
  <header>
    <h1>OPTC LEGACY</h1>
    <p>clean-room recomp target — one codebase, three platforms</p>
  </header>
  <div id="stage"><canvas id="canvas" tabindex="-1"></canvas></div>
  <footer>
    Educational reverse-engineering project. Not affiliated with Bandai Namco.
    Source: <a href="https://github.com/Ali-F-Harandi/OPTC-Legacy">Ali-F-Harandi/OPTC-Legacy</a>
  </footer>
  <script>
    // Emscripten shell glue: hand the canvas to the WASM module.
    var Module = {
      canvas: document.getElementById('canvas'),
      print:   (t) => console.log('[wasm]', t),
      printErr:(t) => console.warn('[wasm]', t),
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
